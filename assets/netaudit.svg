<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="net-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Neon Gradients -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Cyber Grid -->
    <pattern id="net-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(59, 130, 246, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Filter -->
    <filter id="net-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#net-bg-grad)" />
  <rect width="800" height="450" fill="url(#net-grid)" />

  <!-- Top Glass Terminal Bar -->
  <rect x="30" y="25" width="740" height="40" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)" />
  <circle cx="55" cy="45" r="5" fill="#f43f5e" />
  <circle cx="72" cy="45" r="5" fill="#f59e0b" />
  <circle cx="89" cy="45" r="5" fill="#10b981" />
  <text x="120" y="50" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">NETAUDIT.AI // CONFIG_CONFLICT_DIAGNOSTIC_ENGINE</text>
  <rect x="615" y="35" width="135" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
  <text x="682" y="49" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">AI RESOLVER ACTIVE</text>

  <!-- Left Card: Split Code Diff & Conflict File Analysis -->
  <rect x="30" y="80" width="460" height="340" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(59, 130, 246, 0.25)" />
  
  <!-- File Tab Header -->
  <rect x="30" y="80" width="460" height="36" rx="12" fill="rgba(255, 255, 255, 0.03)" />
  <rect x="45" y="88" width="180" height="24" rx="6" fill="rgba(0, 243, 255, 0.1)" stroke="rgba(0, 243, 255, 0.2)" />
  <text x="58" y="104" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="11">📄 core-router.cfg.conflict</text>
  <text x="240" y="104" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">branch: staging-merge</text>

  <!-- Code Conflict & Diff Viewer -->
  <g transform="translate(45, 130)" font-family="'JetBrains Mono', monospace" font-size="11">
    <!-- Line numbers and content -->
    <text x="0" y="15" fill="#475569">39</text>
    <text x="25" y="15" fill="#94a3b8">router bgp 65000</text>

    <text x="0" y="35" fill="#475569">40</text>
    <text x="25" y="35" fill="#94a3b8"> bgp log-neighbor-changes</text>

    <!-- Conflict Marker Header (Red) -->
    <rect x="-5" y="44" width="440" height="22" rx="4" fill="rgba(244, 63, 94, 0.15)" />
    <text x="0" y="58" fill="#f43f5e" font-weight="bold">41</text>
    <text x="25" y="58" fill="#f43f5e" font-weight="bold">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD [CURRENT LOCAL FILE]</text>

    <!-- Conflict Line 1 -->
    <rect x="-5" y="66" width="440" height="20" fill="rgba(244, 63, 94, 0.1)" />
    <text x="0" y="80" fill="#f43f5e">42</text>
    <text x="25" y="80" fill="#fb7185">-  neighbor 10.2.1.5 remote-as 65001</text>

    <!-- Conflict Separator -->
    <rect x="-5" y="86" width="440" height="20" fill="rgba(245, 158, 11, 0.15)" />
    <text x="0" y="100" fill="#f59e0b">43</text>
    <text x="25" y="100" fill="#f59e0b">======= [INCOMING MERGE CONFLICT]</text>

    <!-- Conflict Line 2 -->
    <rect x="-5" y="106" width="440" height="20" fill="rgba(244, 63, 94, 0.1)" />
    <text x="0" y="120" fill="#f43f5e">44</text>
    <text x="25" y="120" fill="#fb7185">-  neighbor 10.2.1.5 remote-as 65002</text>

    <rect x="-5" y="126" width="440" height="20" fill="rgba(244, 63, 94, 0.15)" />
    <text x="0" y="140" fill="#f43f5e" font-weight="bold">45</text>
    <text x="25" y="140" fill="#f43f5e" font-weight="bold">&gt;&gt;&gt;&gt;&gt;&gt;&gt; production-staging</text>

    <!-- AI Generated Solution & Patch (Green) -->
    <rect x="-5" y="152" width="440" height="24" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
    <text x="0" y="168" fill="#10b981" font-weight="bold">AI</text>
    <text x="25" y="168" fill="#34d399" font-weight="bold">+  neighbor 10.2.1.5 remote-as 65001 (Resolved)</text>

    <rect x="-5" y="178" width="440" height="20" fill="rgba(16, 185, 129, 0.1)" />
    <text x="0" y="192" fill="#10b981">47</text>
    <text x="25" y="192" fill="#34d399">+  neighbor 10.2.1.5 route-map PEER-IN in</text>

    <!-- What to change indicator -->
    <text x="0" y="222" fill="#64748b">48</text>
    <text x="25" y="222" fill="#94a3b8"> network 192.168.10.0 mask 255.255.255.0</text>
  </g>

  <!-- Right Top Card: Fault Diagnosis & Cause Analysis -->
  <rect x="510" y="80" width="260" height="180" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(244, 63, 94, 0.3)" />
  <text x="530" y="106" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">⚠️ DETECTED FAULT &amp; ANOMALY</text>
  
  <rect x="530" y="118" width="220" height="42" rx="6" fill="rgba(244, 63, 94, 0.1)" />
  <text x="540" y="134" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">FAULT: BGP AS Collision &amp; IP Clash</text>
  <text x="540" y="148" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9">Line 42 vs 44 specifies clashing peer AS</text>

  <text x="530" y="180" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Root Cause:</text>
  <text x="530" y="195" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="12">Conflicting upstream ASN configuration will cause complete BGP session flapping and packet blackhole.</text>

  <rect x="530" y="225" width="100" height="22" rx="11" fill="rgba(244, 63, 94, 0.2)" />
  <text x="580" y="240" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">HIGH SEVERITY</text>

  <!-- Right Bottom Card: Automated AI Solution & Patch -->
  <rect x="510" y="275" width="260" height="145" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(16, 185, 129, 0.3)" />
  <text x="530" y="300" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">✅ AI AUTOMATED SOLUTION</text>
  
  <text x="530" y="322" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Exact Changes to Apply:</text>
  <text x="530" y="340" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">✓ Strip conflict markers (lines 41-45)</text>
  <text x="530" y="358" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">✓ Harmonize ASN to 65001</text>
  <text x="530" y="376" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">✓ Injected route-map policy guard</text>

  <rect x="530" y="390" width="220" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)" />
  <text x="640" y="403" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">100% CONFLICT-FREE SYNTHESIS</text>
</svg>
