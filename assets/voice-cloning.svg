  <!-- Bottom Panel: Voice Cloning & Real-Time Classification Status -->
  <rect x="30" y="345" width="460" height="75" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
  <g transform="translate(50, 360)">
    <circle cx="10" cy="12" r="6" fill="#00f3ff" filter="url(#neon-blur)" />
    <text x="25" y="16" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold">Neural Voice Cloning &amp; Synthesis Pipeline</text>
    <text x="25" y="36" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Features: Few-Shot Target Cloning | MFCC Feature Extraction | Pitch Deviation Matrix</text>
