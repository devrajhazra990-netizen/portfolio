    <text x="180" y="44" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">12.5%</text>
    <rect x="0" y="52" width="220" height="6" rx="3" fill="rgba(255, 255, 255, 0.1)" />
    <rect x="0" y="52" width="28" height="6" rx="3" fill="#f59e0b" />

    <text x="0" y="76" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Biometric Confidence:</text>
    <text x="180" y="76" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">99.1%</text>
    <rect x="0" y="84" width="220" height="6" rx="3" fill="rgba(255, 255, 255, 0.1)" />
    <rect x="0" y="84" width="218" height="6" rx="3" fill="#00f3ff" />
