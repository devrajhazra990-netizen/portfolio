<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Neon Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="red-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 243, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neon-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg-grad)" />
  <rect width="800" height="450" fill="url(#cyber-grid)" />

  <!-- Top Glass Terminal Bar -->
  <rect x="30" y="25" width="740" height="40" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)" />
  <circle cx="55" cy="45" r="5" fill="#f43f5e" />
  <circle cx="72" cy="45" r="5" fill="#f59e0b" />
  <circle cx="89" cy="45" r="5" fill="#10b981" />
  <text x="120" y="50" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">AI_VOICE_DETECTOR_ENGINE // AUDIO_STREAM_CLASSIFIER_V2.4</text>
  <rect x="630" y="35" width="120" height="20" rx="10" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1" />
  <text x="690" y="49" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">LIVE INFERENCE</text>

  <!-- Left Card: Spectral Waveform & Cloned Voice Analysis -->
  <rect x="30" y="80" width="460" height="250" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(0, 243, 255, 0.2)" />
  <text x="50" y="110" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">Audio Waveform &amp; Timbre Spectral Fingerprint</text>
  <text x="50" y="128" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Sampling: 44.1 kHz • Neural Vocoder Pitch Contour Tracking</text>

  <!-- Oscilloscope / Waveform Lines -->
  <path d="M 50 200 Q 80 150, 110 200 T 170 200 T 230 130 T 270 250 T 320 180 T 370 220 T 420 160 T 470 200" fill="none" stroke="#00f3ff" stroke-width="3" filter="url(#neon-blur)" />
  <path d="M 50 200 Q 90 230, 130 200 T 190 240 T 250 160 T 290 220 T 340 190 T 390 230 T 440 170 T 470 200" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.6" />

  <!-- Spectrum Frequency Bars (Spectrogram) -->
