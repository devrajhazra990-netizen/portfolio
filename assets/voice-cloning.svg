    <rect x="308" y="18" width="8" height="32" rx="3" fill="#3b82f6" opacity="0.6" />
    <rect x="322" y="12" width="8" height="38" rx="3" fill="#00f3ff" opacity="0.7" />
    <rect x="336" y="22" width="8" height="28" rx="3" fill="#f43f5e" opacity="0.6" />
    <rect x="350" y="2" width="8" height="48" rx="3" fill="#f43f5e" opacity="0.9" />
    <rect x="364" y="14" width="8" height="36" rx="3" fill="#00f3ff" opacity="0.7" />
    <rect x="378" y="20" width="8" height="30" rx="3" fill="#a855f7" opacity="0.6" />
    <rect x="392" y="8" width="8" height="42" rx="3" fill="#00f3ff" opacity="0.8" />
    <rect x="406" y="25" width="8" height="25" rx="3" fill="#3b82f6" opacity="0.5" />
  </g>

  <!-- Right Top Card: Authenticity Percentage & Probability Gauge -->
  <rect x="510" y="80" width="260" height="160" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(244, 63, 94, 0.3)" />
  <text x="530" y="110" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">AI DEEPFAKE PROBABILITY</text>
  
  <text x="530" y="155" fill="#f43f5e" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="bold" filter="url(#neon-blur)">98.4%</text>
