    <rect x="140" y="14" width="8" height="36" rx="3" fill="#f43f5e" opacity="0.7" />
    <rect x="154" y="22" width="8" height="28" rx="3" fill="#00f3ff" opacity="0.5" />
    <rect x="168" y="6" width="8" height="44" rx="3" fill="#00f3ff" opacity="0.8" />
    <rect x="182" y="16" width="8" height="34" rx="3" fill="#3b82f6" opacity="0.7" />
    <rect x="196" y="2" width="8" height="48" rx="3" fill="#a855f7" opacity="0.9" />
    <rect x="210" y="10" width="8" height="40" rx="3" fill="#a855f7" opacity="0.8" />
    <rect x="224" y="24" width="8" height="26" rx="3" fill="#f43f5e" opacity="0.6" />
    <rect x="238" y="4" width="8" height="46" rx="3" fill="#f43f5e" opacity="0.9" />
    <rect x="252" y="15" width="8" height="35" rx="3" fill="#00f3ff" opacity="0.7" />
    <rect x="266" y="26" width="8" height="24" rx="3" fill="#00f3ff" opacity="0.5" />
    <rect x="280" y="10" width="8" height="40" rx="3" fill="#a855f7" opacity="0.8" />
