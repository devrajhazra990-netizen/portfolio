    <text x="170" y="12" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">CRITICAL</text>
    <rect x="0" y="20" width="220" height="6" rx="3" fill="rgba(255, 255, 255, 0.1)" />
