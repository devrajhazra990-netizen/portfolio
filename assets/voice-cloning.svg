    <rect x="14" y="15" width="8" height="35" rx="3" fill="#00f3ff" opacity="0.6" />
    <rect x="28" y="5" width="8" height="45" rx="3" fill="#00f3ff" opacity="0.8" />
    <rect x="42" y="18" width="8" height="32" rx="3" fill="#00f3ff" opacity="0.5" />
    <rect x="56" y="2" width="8" height="48" rx="3" fill="#a855f7" opacity="0.9" />
    <rect x="70" y="12" width="8" height="38" rx="3" fill="#a855f7" opacity="0.7" />
    <rect x="84" y="28" width="8" height="22" rx="3" fill="#a855f7" opacity="0.5" />
    <rect x="98" y="8" width="8" height="42" rx="3" fill="#f43f5e" opacity="0.8" />
